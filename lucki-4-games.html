<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUCKI GAME ONLINE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b1d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:22px}
h1{color:#ffd34d;text-align:center;font-size:34px;margin:12px 0 4px}.sub{text-align:center;color:#b9c1dc;font-size:17px;margin-bottom:22px}
.card{background:#121832;border:1px solid #303a63;border-radius:26px;padding:24px}.tabs{display:flex;background:#080d25;border-radius:18px;padding:6px;margin-bottom:20px}
.tabs button,.gamebtn{border:0;padding:15px;border-radius:14px;font-size:17px;font-weight:bold}.tabs button{flex:1;background:transparent;color:#aeb7d5}.tabs button.active{background:#ffd34d;color:#151515}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #354166;background:#091025;color:#fff;font-size:17px;margin:7px 0 14px}.mainbtn{width:100%;padding:17px;border:0;border-radius:16px;background:#ffbd2e;color:#161616;font-size:19px;font-weight:bold}.hidden{display:none}
.balance{float:right;background:#1a2140;padding:10px 17px;border-radius:22px;color:#ffd34d;font-weight:bold}.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.gamebtn{background:#19213f;color:#fff;border:1px solid #39436b}.gamebtn.active{background:#ffd34d;color:#161616}.muted{color:#aeb7d5;line-height:1.5}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}
.reel{background:#fff;color:#e44;font-size:38px;min-height:80px;border-radius:15px;display:grid;place-items:center}.actions{display:flex;gap:12px}.actions button{flex:1}.secondary{background:#252f50;color:#fff}
.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.choice{background:#fff;color:#111;border:0;border-radius:16px;padding:22px 5px;font-size:32px}.choice.selected{outline:4px solid #ffd34d}.score{text-align:center;color:#ffd34d;font-size:20px}
@media(max-width:420px){.wrap{padding:15px}h1{font-size:29px}.reel{font-size:30px;min-height:68px}}
</style></head><body><div class="wrap"><h1>🎰 LUCKI GAME ONLINE</h1><div class="sub">Game virtual • koin permainan • tanpa uang nyata</div>
<section id="auth" class="card"><div class="tabs"><button id="loginTab" class="active">Login</button><button id="regTab">Daftar</button></div>
<div id="loginBox"><h2>Selamat Datang 👑</h2><p class="muted">Masuk untuk melanjutkan permainan.</p><input id="loginUser" placeholder="Username"><input id="loginPass" type="password" placeholder="Password"><button class="mainbtn" id="loginBtn">🚪 Login</button></div>
<div id="regBox" class="hidden"><h2>Daftar Akun</h2><input id="regUser" placeholder="Buat username"><input id="regPass" type="password" placeholder="Buat password"><button class="mainbtn" id="regBtn">✨ Daftar</button></div><p id="authMsg"></p></section>
<section id="app" class="hidden"><div class="card"><div>Halo, <b id="name">Pemain</b> 👋 <span class="balance">🪙 <span id="coins">10000</span></span></div><p class="muted">Pilih salah satu dari 4 permainan virtual.</p>
<div class="games"><button class="gamebtn active" data-game="1">🎰 Lucky Reels</button><button class="gamebtn" data-game="2">🃏 Lucky Cards</button><button class="gamebtn" data-game="3">🎯 Lucky Pick</button><button class="gamebtn" data-game="4">🎡 Lucky Wheel</button></div><div id="game"></div></div></section></div>
<script>
const S=["🍒","🍋","🔔","💎","7️⃣"],st={coins:10000,name:"Pemain",game:1};const $=x=>document.getElementById(x);
function save(){localStorage.setItem("lucki4",JSON.stringify(st))}function load(){try{Object.assign(st,JSON.parse(localStorage.getItem("lucki4")||"{}"))}catch(e){}}function coins(){$("coins").textContent=st.coins.toLocaleString("id-ID")}function spend(n){if(st.coins<n){alert("Koin virtual tidak cukup.");return false}st.coins-=n;save();coins();return true}
function game(){document.querySelectorAll(".gamebtn").forEach(b=>b.classList.toggle("active",+b.dataset.game===st.game));let g=$("game");
if(st.game===1){g.innerHTML='<h2>Lucky Reels</h2><p class="muted">Putar 5 simbol. Biaya 100 koin virtual.</p><div class="reels">'+S.map(()=>'<div class="reel">❓</div>').join("")+'</div><div class="actions"><button class="mainbtn" id="spin">🎰 SPIN · 100</button><button class="mainbtn secondary" id="bonus">🎁 Bonus</button></div><p id="result" class="score"></p>';
$("spin").onclick=()=>{if(!spend(100))return;let a=[...Array(5)].map(()=>S[Math.floor(Math.random()*S.length)]);document.querySelectorAll(".reel").forEach((x,i)=>x.textContent=a[i]);let n=a.filter(x=>x===a[0]).length;if(n>=3){let w=n===5?1000:300;st.coins+=w;save();coins();$("result").textContent="🎉 Menang "+w+" koin virtual!"}else $("result").textContent="Belum menang. Coba lagi."};$("bonus").onclick=()=>{st.coins+=500;save();coins();$("result").textContent="🎁 Bonus +500 koin virtual!"}}
if(st.game===2){g.innerHTML='<h2>Lucky Cards</h2><p class="muted">Pilih 2 kartu. Jika sama, +400 koin virtual.</p><div class="choicegrid" id="cards"></div><p id="result" class="score"></p>';let d=[...S.slice(0,3),...S.slice(0,3)].sort(()=>Math.random()-.5),p=[];$("cards").innerHTML=d.map((_,i)=>'<button class="choice" data-i="'+i+'">❓</button>').join("");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{if(p.length>=2)return;let i=+b.dataset.i;if(p.includes(i))return;p.push(i);b.textContent=d[i];b.classList.add("selected");if(p.length===2){if(d[p[0]]===d[p[1]]){st.coins+=400;$("result").textContent="🃏 Cocok! +400 koin virtual"}else $("result").textContent="Belum cocok.";save();coins()}})}
if(st.game===3){g.innerHTML='<h2>Lucky Pick</h2><p class="muted">Pilih satu dari 9 kotak.</p><div class="choicegrid" id="pick"></div><p id="result" class="score"></p>';let w=Math.floor(Math.random()*9);$("pick").innerHTML=[...Array(9)].map((_,i)=>'<button class="choice" data-i="'+i+'">🎁</button>').join("");document.querySelectorAll("#pick .choice").forEach(b=>b.onclick=()=>{document.querySelectorAll("#pick .choice").forEach(x=>x.disabled=true);if(+b.dataset.i===w){st.coins+=600;$("result").textContent="🎉 Tepat! +600 koin virtual"}else $("result").textContent="Belum tepat. Coba lagi.";save();coins()})}
if(st.game===4){g.innerHTML='<h2>Lucky Wheel</h2><p class="muted">Putar hadiah virtual. Biaya 100 koin.</p><div style="font-size:90px;text-align:center;margin:18px">🎡</div><button class="mainbtn" id="wheel">🎡 PUTAR · 100</button><p id="result" class="score"></p>';$("wheel").onclick=()=>{if(!spend(100))return;let a=[0,100,200,300,500,800],w=a[Math.floor(Math.random()*a.length)];st.coins+=w;save();coins();$("result").textContent=w?"🎉 +"+w+" koin virtual!":"Belum beruntung kali ini."}}}
$("loginTab").onclick=()=>{$("loginTab").classList.add("active");$("regTab").classList.remove("active");$("loginBox").classList.remove("hidden");$("regBox").classList.add("hidden")};$("regTab").onclick=()=>{$("regTab").classList.add("active");$("loginTab").classList.remove("active");$("regBox").classList.remove("hidden");$("loginBox").classList.add("hidden")};
$("regBtn").onclick=()=>{let u=$("regUser").value.trim(),p=$("regPass").value;if(!u||!p)return $("authMsg").textContent="Lengkapi data.";localStorage.setItem("luckiUser",u);localStorage.setItem("luckiPass",p);$("authMsg").textContent="Berhasil daftar. Silakan Login.";$("loginTab").click();$("loginUser").value=u};
$("loginBtn").onclick=()=>{let u=$("loginUser").value.trim(),p=$("loginPass").value;if(!u||!p)return $("authMsg").textContent="Masukkan username dan password.";st.name=u;load();$("name").textContent=st.name;$("auth").classList.add("hidden");$("app").classList.remove("hidden");coins();game()};
document.querySelectorAll(".gamebtn").forEach(b=>b.onclick=()=>{st.game=+b.dataset.game;game()});load();
</script></body></html>
